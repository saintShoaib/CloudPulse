<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}
@media (max-width: 768px){
  .search{height:52px;padding:0 12px;border-radius:14px}
  .input{font-size:16px}
  .dropdown{top:59px;max-height:min(360px,55vh);border-radius:14px}
  .row{min-height:62px;padding:9px 10px;gap:9px}
  .pin{width:32px;height:32px;border-radius:9px;font-size:14px}
  .main{font-size:13px}
  .sub{font-size:10.5px;margin-top:3px}
  .type{font-size:8px}
}
@media (max-width: 390px){
  .search{height:50px;padding:0 10px}
  .dropdown{top:57px}
  .row{min-height:58px}
  .type{display:none}
}html,body{margin:0;padding:0;background:transparent;color:#edf5ff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{position:relative;width:100%}.search{height:56px;display:flex;align-items:center;gap:10px;padding:0 14px;background:#091321;border:1px solid #34465b;border-radius:16px;box-shadow:0 8px 26px rgba(0,0,0,.16);transition:border-color .16s,box-shadow .16s}
.search.focus{border-color:#55e0d3;box-shadow:0 0 0 3px rgba(85,224,211,.08),0 12px 34px rgba(0,0,0,.22)}
.icon{font-size:19px;color:#75a2b9;width:22px;text-align:center}.input{flex:1;min-width:0;height:100%;border:0;outline:0;background:transparent;color:#f4f8ff;font-size:16px}.input::placeholder{color:#71869c}
.clear{display:none;width:26px;height:26px;border:0;border-radius:50%;background:#172638;color:#9bb0c3;cursor:pointer;font-size:16px}.clear:hover{background:#21344a;color:#fff}
.spinner{display:none;width:17px;height:17px;border:2px solid #284053;border-top-color:#5be4d5;border-radius:50%;animation:spin .65s linear infinite;flex:none}@keyframes spin{to{transform:rotate(360deg)}}
.dropdown{position:absolute;z-index:9999;left:0;right:0;top:64px;background:#091321;border:1px solid #304258;border-radius:16px;overflow-y:auto;overflow-x:hidden;max-height:min(430px,60vh);scrollbar-width:thin;box-shadow:0 24px 55px rgba(0,0,0,.55);display:none}
.row{min-height:68px;padding:10px 13px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(151,173,198,.08);cursor:pointer}.row:last-child{border-bottom:0}.row:hover,.row.active{background:#102033}
.pin{width:36px;height:36px;border-radius:11px;background:#102c32;color:#63e5d7;display:grid;place-items:center;font-size:16px;flex:none}.main{font-size:14px;font-weight:760;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{font-size:11.5px;color:#8196aa;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.type{font-size:9px;text-transform:uppercase;letter-spacing:1px;color:#62d8cf;margin-left:auto;flex:none;padding-left:8px}
.empty,.loading{padding:16px;color:#8196aa;font-size:12px}.loading{display:flex;align-items:center;gap:9px}.smallspin{width:14px;height:14px;border:2px solid #294052;border-top-color:#5be4d5;border-radius:50%;animation:spin .65s linear infinite}
.recent{margin-top:8px;display:flex;gap:7px;overflow:auto;padding-bottom:2px}.recent button{white-space:nowrap;border:1px solid rgba(151,173,198,.14);background:#0b1726;color:#a9bbcb;border-radius:999px;padding:6px 10px;font-size:11px;cursor:pointer}.recent button:hover{background:#122338;color:#fff}
.foot{font-size:10px;color:#60768b;margin:7px 3px 0}.kbd{float:right;border:1px solid #304052;border-radius:5px;padding:1px 5px;color:#8195aa}
</style></head><body>
<div class="wrap" id="wrap"><div class="search" id="search"><div class="icon">⌕</div><input id="q" class="input" autocomplete="off" spellcheck="false" placeholder="Search a city, university, district, landmark, street…"><button id="clear" class="clear" type="button">×</button><div id="spin" class="spinner"></div></div><div id="dropdown" class="dropdown"></div></div>
<script>
const q=document.getElementById('q'), search=document.getElementById('search'), dropdown=document.getElementById('dropdown'), spin=document.getElementById('spin'), clear=document.getElementById('clear');
let timer=null, controller=null, items=[], active=-1, cache=new Map(), lastArgs={}, lastValueVersion=null;
function send(v){
  window.parent.postMessage({isStreamlitMessage:true,type:'streamlit:setComponentValue',value:v},'*');
}
function height(){const open=dropdown.style.display!=='none'; const h=open ? Math.min(Math.max(dropdown.getBoundingClientRect().bottom+18,140),560) : 70; window.parent.postMessage({isStreamlitMessage:true,type:'streamlit:setFrameHeight',height:h},'*')}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function show(html){dropdown.innerHTML=html;dropdown.style.display='block';height()}
function hide(){dropdown.style.display='none';active=-1;height()}
function normalizeFeature(f){const p=f.properties||{},c=f.geometry?.coordinates||[];if(c.length<2)return null;const name=p.name||p.street||p.city||p.district||p.state||p.country||'Place';const parts=[p.street,p.district,p.suburb,p.city,p.state,p.country].filter(Boolean).filter((x,i,a)=>a.indexOf(x)===i&&x!==name);const address=parts.join(' · ');const raw=(p.osm_value||p.type||p.osm_key||'place').toString();const category=raw.replaceAll('_',' ').replace(/\b\w/g,m=>m.toUpperCase());return{name,address,display:address?name+', '+address:name,lat:+c[1],lon:+c[0],category,type:raw}}
function renderRecent(list){height()}
function draw(data){items=data||[];active=-1;if(!items.length){show('<div class="empty">No close matches. Try adding a city or state, e.g. “Integral University, Lucknow”.</div>');return}show(items.map((p,i)=>`<div class="row" data-i="${i}"><div class="pin">⌖</div><div style="min-width:0;flex:1"><div class="main">${esc(p.name)}</div><div class="sub">${esc(p.address||'Location')}</div></div><div class="type">${esc(p.category||'PLACE')}</div></div>`).join(''));dropdown.querySelectorAll('.row').forEach(el=>el.addEventListener('click',e=>{e.preventDefault();choose(items[+el.dataset.i])}));}
function choose(p){
  if(!p)return;
  const chosen={name:p.name||'Selected location',address:p.address||'',display:p.display||'',lat:Number(p.lat),lon:Number(p.lon),type:p.type||'place',category:p.category||'Place'};
  q.value=chosen.name;
  clear.style.display='block';
  hide();
  // Send twice in the same task only through the supported protocol path; the
  // second post is a compatibility fallback for Streamlit/browser combinations.
  send({action:'select',place:chosen,query:q.value,event_id:String(Date.now())+'-'+Math.random().toString(36).slice(2,8)});
}
async function suggest(){const text=q.value.trim();clear.style.display=text?'block':'none';if(text.length<2){hide();return}const key=text.toLowerCase()+'|'+(lastArgs.bias_lat||'')+'|'+(lastArgs.bias_lon||'');if(cache.has(key)){draw(cache.get(key));return}if(controller)controller.abort();controller=new AbortController();spin.style.display='block';show('<div class="loading"><span class="smallspin"></span> Finding places…</div>');try{const params=new URLSearchParams({q:text,limit:'8',lang:'en'});if(lastArgs.bias_lat)params.set('lat',String(lastArgs.bias_lat));if(lastArgs.bias_lon)params.set('lon',String(lastArgs.bias_lon));const r=await fetch('https://photon.komoot.io/api/?'+params.toString(),{signal:controller.signal,headers:{'Accept':'application/json'}});if(!r.ok)throw Error('search');const js=await r.json();const out=[],seen=new Set();for(const f of (js.features||[])){const p=normalizeFeature(f);if(!p)continue;const k=(p.name+'|'+p.address).toLowerCase();if(seen.has(k))continue;seen.add(k);out.push(p)}cache.set(key,out);if(cache.size>40)cache.delete(cache.keys().next().value);draw(out)}catch(e){if(e.name!=='AbortError')show('<div class="empty">Search is temporarily unavailable. Try again in a moment.</div>')}finally{spin.style.display='none';height()}}
q.addEventListener('focus',()=>search.classList.add('focus'));q.addEventListener('blur',()=>search.classList.remove('focus'));
q.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(suggest,280)});
q.addEventListener('keydown',e=>{if(dropdown.style.display==='none'||!items.length)return;if(e.key==='ArrowDown'){e.preventDefault();active=Math.min(active+1,items.length-1)}else if(e.key==='ArrowUp'){e.preventDefault();active=Math.max(active-1,0)}else if(e.key==='Enter'){e.preventDefault();if(active>=0)choose(items[active]);else if(items[0])choose(items[0]);return}else if(e.key==='Escape'){hide();return}else{return}dropdown.querySelectorAll('.row').forEach((el,i)=>el.classList.toggle('active',i===active))});
clear.onclick=()=>{q.value='';clear.style.display='none';items=[];hide();q.focus();send({action:'clear',event_id:String(Date.now())+'-'+Math.random().toString(36).slice(2,8)})};document.addEventListener('mousedown',e=>{if(!e.target.closest('#wrap'))hide()});
window.addEventListener('message',e=>{const d=e.data;if(!d||d.type!=='streamlit:render')return;lastArgs=d.args||{};const version=lastArgs.value_version??0;if(lastValueVersion===null||version!==lastValueVersion){q.value=lastArgs.initial_query||'';clear.style.display=q.value?'block':'none';items=[];hide();lastValueVersion=version;}height();});
window.parent.postMessage({isStreamlitMessage:true,type:'streamlit:componentReady',apiVersion:1},'*');window.setTimeout(height,0);
</script></body></html>
